<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main>
        <h1 class="mt-3 text-center">To-do</h1>
        <div class="container">
            <div class="row" id="todo-preferences-wrapper">
                <div class="col-9">
                    <form data-form="todoCreate">
                        <div class="input-group mb-3">
                            <input data-input="todoText" type="text" class="form-control" placeholder="Recipient's username" aria-label="Recipient's username" aria-describedby="button-addon2">
                            <button class="btn btn-outline-secondary" type="submit" id="button-addon2">Add</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="container">
            <div class="row">
                <div class="col-9">
                    <ul class="list-group list-group-horizontal" data-filter="FilterList">
                        <a href="#" class="list-group-item list-group-item-action list-group-item-primary" id="all">All</a>
                        <a href="#" class="list-group-item list-group-item-action" id="active">Active</a>
                        <a href="#" class="list-group-item list-group-item-action" id="completed">Completed</a>
                    </ul>
                </div>
            </div>
        </div>
        <div class="container">
            <div class="row">
                <div class="col-9 d-flex justify-content-between">
                    <div class="p-2">
                        Выполненные: <span id="completedCount">0</span>
                    </div>
                    <div class="p-2">
                        Невыполненные: <span id="uncompletedCount">0</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="container">
            <div class="row">
                <div class="col-9">
                    <ul class="list-group" data-list="todoList">
<!--                        <li class="list-group-item d-flex align-items-center justify-content-between">-->
<!--                            <div class="text-black"><b></b></div>-->
<!--                            <div class="d-flex justify-content-end gap-1">-->
<!--                                <button type="button" class="btn btn-success">Done</button>-->
<!--                                <button type="button" class="btn btn-danger">Delete</button>-->
<!--                            </div>-->
<!--                        </li>-->
                    </ul>
                </div>
            </div>
        </div>

    </main>
  <script src="./scripts/TodoController.js" type="module"></script>
</body>
</html>
